<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Maldives / Sri Lanka: checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8C%B4%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div class="hero"><div class="hero-inner">
  <span class="eyebrow">Rishabh &amp; Divya · trip checklist</span>
  <h1 class="trip">🇲🇻 Maldives <span class="sep">/</span> 🇱🇰 Sri Lanka</h1>
  <p>What to do before you fly and what to bring, one list each. Tap to tick, ＋ to add. You both see the same lists, live.</p>
  <a class="cta-hero" href="day-plan.html"><span>🗺️</span><span><b>Day-by-day plan</b><small>Each day, with the map</small></span><span class="arrow">→</span></a>
</div></div>
<main>

<div id="app" hidden>
  <div class="who" role="group" aria-label="Whose list">
    <button type="button" id="who-rishabh" aria-pressed="true">Rishabh<small></small></button>
    <button type="button" id="who-divya" aria-pressed="false">Divya<small></small></button>
  </div>
  <div class="progress"><div class="meter"><span id="meter"></span></div><div class="count" id="count"></div></div>
  <div class="bar">
    <div class="sync" id="sync" role="status">Connecting…</div>
    <button type="button" id="edit" aria-pressed="false">✎ Edit list</button>
  </div>
  <div id="lists"></div>
  <div class="foot-actions"><button type="button" id="untick">Untick everything on this list</button></div>
</div>

<section id="gate" class="gate" hidden>
  <h2>🔒 Private</h2>
  <p id="gate-msg">Enter the trip password.</p>
  <form id="gate-form">
    <input id="gate-input" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="Password" aria-label="Trip password">
    <button type="submit">Open</button>
  </form>
</section>

<footer>Have a wonderful trip! 🌴<br><button type="button" id="lock" hidden>🔒 Lock on this phone</button></footer>
</main>
<script src="config.js?v=5"></script>
<script src="core.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
