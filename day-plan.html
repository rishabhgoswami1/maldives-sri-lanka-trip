<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Maldives / Sri Lanka: day-by-day plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8C%B4%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<!-- After changing style.css or a .js file, raise the ?v= number on the links below (both pages) so phones load the new copy.
     The plan is not in this page. It is loaded from the database after the password (plan.js).
     To change it: edit ~/sri-lanka-maldives-trip/site-admin/plan.json, then node site-admin/plan.mjs push -->
<div class="hero"><div class="hero-inner">
  <a class="back" href="./">← Checklist</a>
  <div class="eyebrow-row"><span class="eyebrow">🇲🇻 Maldives / 🇱🇰 Sri Lanka</span></div>
  <h1>Day-by-day plan</h1>
  <p id="subtitle"></p>
</div></div>
<main>

<div id="app" hidden>
  <nav class="days" id="days" aria-label="Jump to a day"></nav>
  <div class="sync" id="sync" role="status" hidden></div>
  <div id="plan"></div>
</div>

<section id="gate" class="gate" hidden>
  <h2>🔒 Private</h2>
  <p id="gate-msg">Enter the trip password.</p>
  <form id="gate-form">
    <input id="gate-input" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="Password" aria-label="Trip password">
    <button type="submit">Open</button>
  </form>
</section>

<footer>Have a wonderful trip! 🌴<br><button type="button" id="lock" hidden>🔒 Lock on this phone</button></footer>
</main>
<script src="config.js?v=7"></script>
<script src="core.js?v=7"></script>
<script src="plan.js?v=7"></script>
</body>
</html>
